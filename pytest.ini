[pytest]
norecursedirs = .git .tox *.egg* old docs dist build
# By default run the fast unit tests only; the `make integration-tests` target
# opts back in with `-m integration`.
addopts = --strict-markers --strict-config -ra -m "not integration"
pythonpath = src
testpaths = tests
filterwarnings =
  # logdecorator module have deprecation warning
  #ignore:The default value of the `reraise` parameter will be changed to `True` in the future.*:DeprecationWarning

markers =
  integration: end-to-end tests that invoke the real kubesplit CLI and diff output trees against test-assets/expected (deselect with '-m "not integration"').
