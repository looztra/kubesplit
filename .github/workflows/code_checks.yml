---
name: Code checks
on:
  push:
    branches:
      - main
    tags:
      - v*.*.*
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      force_release:
        description: Force release
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}-checks
  cancel-in-progress: true

env:
  UV_LINK_MODE: copy
  UV_PYTHON_PREFERENCE: only-managed
  UV_CACHE_DIR: /tmp/.uv-cache
  # Keep uv-managed Python interpreters inside the mise data dir so that they are
  # saved and restored together with the mise cache. Otherwise, on a cache hit, the
  # 'pypi:yamllint' tool venv points to an interpreter that was not restored.
  # Bump the mise cache key prefix whenever this location changes.
  UV_PYTHON_INSTALL_DIR: /home/runner/.local/share/mise/uv-python
  MISE_INSTALL_FROM_GITHUB: 1
  # The following repository variables control mise-action caching across jobs:
  # - MISE_CACHE_ENABLED: set to 'false' to disable mise action caching; defaults to 'true' when unset
  # - MISE_CACHE_KEY_PREFIX: prefix used for cache keys so different workflows can share/segregate caches

jobs:
  hk:
    name: hk hooks
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout current branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          install: true
          cache: ${{ vars.MISE_CACHE_ENABLED || 'true'}}
          cache_key_prefix: ${{ vars.MISE_CACHE_KEY_PREFIX || 'mise-v2'}}
          version: ${{ vars.MISE_VERSION }}

      - name: Restore uv cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.UV_CACHE_DIR }}
          key: uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: |
            uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
            uv-${{ runner.os }}

      - name: Setup venv
        run: |
          uv python install
          make setup-venv

      - name: Check if uv lock file is up to date
        env:
          UV_KEYRING_PROVIDER: subprocess
        run: |
          echo "::group::Check if uv lock file is up to date"
          echo "Detect files that could affect the dynamic versioning if any (git dirty state)"
          git status --porcelain --untracked-files
          echo "Performing 'uv lock' in dry-run mode"
          uv lock --dry-run
          echo "Performing 'uv lock'"
          if ! uv lock --locked ; then
            echo "::error title=uv lock file::The lockfile at 'uv.lock' needs to be updated. To update the lockfile, run 'uv lock'"
            exit 1
          fi
          echo "::endgroup::"

      - name: Minimize uv cache
        run: uv cache prune --ci

      - name: Restore prek cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/prek
          key: prek-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Run hk hooks
        run: |
          echo "::group::Run hk hooks"
          mise run hk:check
          echo "::endgroup::"

  python-checks:
    name: Python checks
    runs-on: ubuntu-latest
    outputs:
      deploy_env: ${{ steps.detect-deploy-env.outputs.deploy_env }}
      is_release: ${{ steps.detect-release.outputs.is_release }}
    steps:
      - name: Detect release run
        id: detect-release
        env:
          IS_RELEASE: ${{ ((github.event_name == 'push' && startsWith(github.ref, 'refs/tags')) || (github.event_name == 'pull_request' && github.head_ref == 'release-please--branches--main') || inputs.force_release) && 'true' || 'false' }}
        run: |
          echo "is_release=${IS_RELEASE}" >> "${GITHUB_OUTPUT}"

      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history is required: versioningit computes the version
          # of the built distribution from git tags and commit distance.
          fetch-depth: 0
          persist-credentials: false

      # Caches are disabled on release runs so that a poisoned cache entry
      # cannot influence the distribution published to (Test)PyPI.
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          install: true
          cache: ${{ steps.detect-release.outputs.is_release == 'true' && 'false' || vars.MISE_CACHE_ENABLED || 'true' }}
          cache_key_prefix: ${{ vars.MISE_CACHE_KEY_PREFIX || 'mise-v2'}}
          version: ${{ vars.MISE_VERSION }}

      - name: Restore uv cache
        if: steps.detect-release.outputs.is_release != 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/.uv-cache
          key: uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: |
            uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
            uv-${{ runner.os }}

      - name: Setup venv
        run: |
          uv python install
          mise run venv:setup

      - name: Python checks
        run: |
          echo "::group::mise run lint"
          mise run lint
          echo "::endgroup::"
          echo "::group::mise run test"
          mise run test
          echo "::endgroup::"

      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: generated/junit.xml
          report_type: test_results

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Minimize uv cache
        run: uv cache prune --ci

      - name: Check we can build the distribution
        run: |
          echo "::group::mise run dist"
          mise run dist
          echo "::endgroup::"

      - name: Store the distribution packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.detect-release.outputs.is_release == 'true'
        with:
          name: python-package-distributions
          path: dist/

      - name: Detect environment
        if: steps.detect-release.outputs.is_release == 'true'
        id: detect-deploy-env
        run: |
          echo "deploy_env=${{ startsWith(github.ref, 'refs/tags') && 'pypi' || 'testpypi' }}" >> "${GITHUB_OUTPUT}"

  deploy-release:
    name: Deploy Release
    runs-on: ubuntu-latest
    if: needs.python-checks.outputs.is_release == 'true'
    environment:
      name: ${{ needs.python-checks.outputs.deploy_env }}
      url: ${{ needs.python-checks.outputs.deploy_env == 'pypi' && 'https://pypi.org/project/kubesplit/' || 'https://test.pypi.org/project/kubesplit/' }}
    permissions:
      id-token: write
    # Every check must pass before anything is published, now that the checks
    # run as parallel jobs instead of gating 'python-checks'.
    needs:
      - hk
      - python-checks
      - mkdocs
      - integration-tests
      - python-versions
    steps:
      - name: Download the distribution packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish package distributions to TestPyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          repository-url: ${{ needs.python-checks.outputs.deploy_env == 'pypi' && 'https://upload.pypi.org/legacy/' || 'https://test.pypi.org/legacy/' }}

  mkdocs:
    name: Build doc
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history is required by the git-revision-date-localized
          # mkdocs plugin to render accurate page dates.
          fetch-depth: 0
          persist-credentials: false

      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          install: true
          cache: ${{ vars.MISE_CACHE_ENABLED || 'true'}}
          cache_key_prefix: ${{ vars.MISE_CACHE_KEY_PREFIX || 'mise-v2'}}
          version: ${{ vars.MISE_VERSION }}

      - name: Restore uv cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.UV_CACHE_DIR }}
          key: uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: |
            uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
            uv-${{ runner.os }}

      - name: Setup venv
        run: |
          uv python install
          mise run venv:setup

      - name: Check we can build the docs
        run: |
          echo "::group::mise run docs:build"
          mise run docs:build
          echo "::endgroup::"

  integration-tests:
    name: Integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          install: true
          cache: ${{ vars.MISE_CACHE_ENABLED || 'true'}}
          cache_key_prefix: ${{ vars.MISE_CACHE_KEY_PREFIX || 'mise-v2'}}
          version: ${{ vars.MISE_VERSION }}

      - name: Restore uv cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.UV_CACHE_DIR }}
          key: uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: |
            uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
            uv-${{ runner.os }}

      - name: Setup venv
        run: |
          uv python install
          mise run venv:setup

      - name: Run integration tests
        run: |
          echo "::group::mise run test:integration"
          mise run test:integration
          echo "::endgroup::"

  python-versions:
    name: Tests with all supported python versions
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          install: true
          cache: ${{ vars.MISE_CACHE_ENABLED || 'true'}}
          cache_key_prefix: ${{ vars.MISE_CACHE_KEY_PREFIX || 'mise-v2'}}
          version: ${{ vars.MISE_VERSION }}

      - name: Restore uv cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.UV_CACHE_DIR }}
          key: uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: |
            uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
            uv-${{ runner.os }}

      - name: Setup venv
        run: |
          uv python install
          mise run venv:setup

      - name: Run tests for all supported python versions
        run: |
          echo "::group::mise run test:python-versions"
          mise run test:python-versions
          echo "::endgroup::"

  finalizer:
    name: Finalizer
    if: always()
    runs-on: ubuntu-latest
    needs:
      - hk
      - python-checks
      - mkdocs
      - integration-tests
      - python-versions
    steps:
      - name: Decide whether the needed jobs succeeded or failed
        uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # v1.3.0
        with:
          jobs: ${{ toJSON(needs) }}
